# Lint configuration for Pando. golangci-lint v2 format.
#
# The depguard block below is not style enforcement — it is R-027 made mechanical.
# See docs/design/03-adapter-interfaces.md §9 and internal/adapter/CLAUDE.md.
#
# gosec is the static analysis pass for common vulnerability classes. Every
# suppression in the source names the rule and why it does not apply; a bare
# //nolint is indistinguishable from one nobody checked. See SECURITY.md.
#
# errcheck, govet, ineffassign, staticcheck and unused are enabled by default in v2
# and are not repeated here.

version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gosec
    - nilerr
    - rowserrcheck
    - sqlclosecheck

  settings:
    gosec:
      excludes:
        # G101 matches on identifier *names*, not values. Every hit in this
        # repository is a constant whose name contains "secret" or "token" and
        # whose value is a verb string or an error code — `app.secrets.write`,
        # `AUTH_TOKEN_INVALID`. Suppressed globally rather than site by site,
        # because the verb list and the error code list both grow, and a rule
        # that fires on every addition is a rule people learn to silence.
        - G101

    depguard:
      rules:
        # R-027: adapters cannot touch authorization, audit, or state.
        #
        # An adapter that can read the state store can authorize itself; one that can
        # write the audit log can erase itself. This boundary is the whole point of the
        # adapter model, so it is enforced here rather than left to code review.
        adapters-must-not-import-core:
          list-mode: lax
          files:
            - '**/internal/adapter/**'
          deny:
            - pkg: github.com/trypando/pando/internal/core/authz
              desc: 'R-027: adapters must not import core/authz. Core authorizes; adapters translate.'
            - pkg: github.com/trypando/pando/internal/core/audit
              desc: 'R-027: adapters must not import core/audit. The audit log is written by core only.'
            - pkg: github.com/trypando/pando/internal/core/state
              desc: 'R-027: adapters must not import core/state. Adapters receive fully-resolved requests.'
            - pkg: github.com/trypando/pando/internal/core/policy
              desc: 'R-027: adapters must not evaluate policy. The planner does, before the adapter is called.'
            - pkg: github.com/trypando/pando/internal/core/detection
              desc: 'R-027: adapters must not import core/detection. It orchestrates them; the dependency runs one way.'
            - pkg: github.com/trypando/pando/internal/detect
              desc: 'R-027: adapters must not import internal/detect. A type an adapter and detection both need belongs in internal/adapter/api, which is the only core-adjacent package an adapter may import. The OCI registry probe reached across this before the rule existed.'

        # The adapter interface package is a contract, not a place for logic
        # (design 03). It may name the spec's vocabulary — design 03 §3 has Bid
        # carrying a spec fragment — because the alternative is a second copy of
        # IsolationClass, RoutingMode and BuildStrategy that must be kept in step
        # with the first, with a conversion at every boundary. One ordered enum
        # that can drift out of sync is a worse failure than the coupling.
        #
        # The direction is what matters for R-251: the spec's vocabulary is the
        # shared one, and adapters translate from it. Everything else in core
        # stays denied by the rule above.
        adapter-api-defines-only:
          list-mode: lax
          files:
            - '**/internal/adapter/api/**'
          deny:
            - pkg: github.com/trypando/pando/internal/core/planner
              desc: 'internal/adapter/api holds interface definitions only (design 03).'
            - pkg: github.com/trypando/pando/internal/core/reconciler
              desc: 'internal/adapter/api holds interface definitions only (design 03).'

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # Tests deliberately build the insecure thing in order to assert that the
      # code under test rejects it: a forged cookie with no Secure flag, a
      # handler that echoes its path. Flagging the fixture rather than the
      # behavior under test is noise, and the R-053 and R-173 tests are exactly
      # the ones that would be weakened to silence it.
      - path: _test\.go
        linters:
          - gosec
      # The load harness draws which user, app and endpoint to exercise next.
      # Nothing it draws is a secret, and a cryptographic source per request
      # would be the harness's own bottleneck.
      - path: ^test/load/
        linters:
          - gosec
        text: G404
    paths:
      - third_party$
      - builtin$
      - examples$

# Report every finding. The defaults cap a linter at 50 issues and the same
# issue at 3, which hid four gosec findings behind three identical ones the
# first time gosec was switched on — including a real one.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
