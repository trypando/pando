# What Pando's ServiceAccount may do (notes-kubernetes-runtime-issue-72.md,
# "RBAC, minimal").
#
# Cluster-wide: make and remove app namespaces, bind one role in them, read
# nodes and pods for capacity, set a volume's reclaim policy. Everything an app
# needs inside its namespace comes from pando-app-manager, which Pando binds in
# each namespace it makes and holds nowhere else. Nothing in kube-system, no
# nodes/proxy, no pods/exec outside app namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pando
  namespace: pando
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pando
rules:
  # One namespace per app. A delete is limited to namespaces Pando made by
  # admission-policy.yaml: RBAC cannot select by label.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, delete]
  # A new namespace takes no pod until the controller manager has made its
  # default ServiceAccount, which Pando waits to see (awaitServiceAccount).
  # Get only, and cluster-wide because the namespace's own binding may not
  # be in effect yet when Pando first looks.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get]
  # Binds pando-app-manager in each app namespace.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [pando-app-manager]
  # Capacity: allocatable room per node, less what other pods request. Read
  # only: listing pods cluster-wide is how Pando sees the requests of work
  # that is not its own on the nodes it reports (R-243). Pando cannot change,
  # exec into or read the logs of any pod outside its own namespaces.
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  # What apps are using now (R-245), when metrics-server is installed.
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # Retain while an app keeps its volumes (R-204); Delete when a volume is
  # destroyed on purpose.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, patch, delete]
  # The isolation class (R-114).
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pando
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pando
subjects:
  - kind: ServiceAccount
    name: pando
    namespace: pando
---
# Bound by Pando in each namespace it makes — an app's, a trial's, the
# NetworkPolicy canary's — and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pando-app-manager
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, services, persistentvolumeclaims, configmaps, secrets, resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
# The edge's namespace: Pando runs the edge and writes its routes (R-174).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pando
  namespace: pando-edge
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pando
  namespace: pando-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pando
subjects:
  - kind: ServiceAccount
    name: pando
    namespace: pando
---
# Traefik's identity: it reads what its CRD provider watches, in its own
# namespace only. A cloudflared edge runs with no ServiceAccount token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pando-edge-traefik
  namespace: pando-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pando-edge-traefik
  namespace: pando-edge
rules:
  - apiGroups: [traefik.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pando-edge-traefik
  namespace: pando-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pando-edge-traefik
subjects:
  - kind: ServiceAccount
    name: pando-edge-traefik
    namespace: pando-edge
---
# Traefik's CRD provider (v3.2 and later) watches nodes, cluster-wide, and
# serves no route until that watch syncs: without this every request to the
# edge was a 404, with "nodes is forbidden" in its log. Read only; nodes hold
# no secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pando-edge-traefik
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pando-edge-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pando-edge-traefik
subjects:
  - kind: ServiceAccount
    name: pando-edge-traefik
    namespace: pando-edge
