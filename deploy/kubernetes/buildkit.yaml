# Rootless BuildKit (R-111), as the Compose file runs it, alone in the
# pando-build namespace (O-48).
#
# Rootless BuildKit makes its own user and mount namespaces, which the
# container runtime's default seccomp and AppArmor profiles refuse. So it asks
# for both Unconfined, which Pod Security baseline would refuse; pando-build
# enforces privileged instead, and holds nothing else. Nothing is privileged
# and no container runtime socket is mounted, here or anywhere (R-112).
#
# The Compose install narrows seccomp with buildkit-seccomp.json instead of
# Unconfined: the default profile plus only what rootless BuildKit needs
# (issue #130). Kubernetes reads a custom profile from each node's disk, which
# a manifest cannot put there. To use it, copy buildkit-seccomp.json to
# /var/lib/kubelet/seccomp/pando/ on every node that can run this pod, and
# change seccompProfile below to type Localhost with localhostProfile
# pando/buildkit-seccomp.json.
#
# Its NetworkPolicy (networkpolicy.yaml) admits only Pando's server pods, and
# lets builds reach DNS, an in-cluster registry and anywhere outside the
# cluster — nothing else inside it (R-113).
#
# On Kubernetes a build is pushed to a registry and every node pulls it
# (notes-image-registry-issue-72.md); set PANDO_REGISTRY_URL on Pando's
# Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: pando-build
  labels:
    app.kubernetes.io/name: buildkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
          args: [--addr, tcp://0.0.0.0:1234, --oci-worker-no-process-sandbox]
          ports:
            - containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            privileged: false
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: pando-build
spec:
  selector:
    app.kubernetes.io/name: buildkit
  ports:
    - port: 1234
      targetPort: 1234
