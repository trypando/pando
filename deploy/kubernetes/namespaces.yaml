# Pando's own namespace, and the edge's (notes-kubernetes-runtime-issue-72.md).
#
# The edge is in a namespace of its own so that Traefik's ServiceAccount, which
# reads routes and certificates there, can read nothing of Pando's: the
# secrets key is in "pando". App namespaces are made by Pando, one per app.
apiVersion: v1
kind: Namespace
metadata:
  name: pando
  labels:
    app.kubernetes.io/managed-by: pando
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: pando-edge
  labels:
    app.kubernetes.io/managed-by: pando
    pod-security.kubernetes.io/enforce: baseline
