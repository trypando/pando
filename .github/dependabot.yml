# Dependabot. Grouped updates, weekly, so that keeping dependencies current is
# one pull request to review rather than fifteen — fifteen is how a project ends
# up merging them without reading any.
#
# Security updates are not grouped and not weekly: GitHub raises those
# immediately and separately, whatever is configured here.

version: 2

# The Dockerfile's base images are Docker Hardened Images, which dhi.io serves
# only to a signed-in Docker account. These are Dependabot secrets, stored
# separately from the Actions secrets of the same name (Settings → Secrets →
# Dependabot).
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    # A major bump of any of these is a change to how Pando builds or runs
    # apps, not a version number. Reviewed one at a time.
    ignore:
      - dependency-name: github.com/docker/docker
        update-types: ["version-update:semver-major"]
      - dependency-name: github.com/moby/buildkit
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # A tool and its plugins move together or not at all.
      #
      # Without these, a major bump arrives on its own and cannot even install:
      # vite 8 was proposed while @vitejs/plugin-react still peered
      # `^4 || ^5 || ^6 || ^7`, so `npm ci` failed with ERESOLVE before any
      # check in the workflow ran. The pull request is not reviewable — it is
      # red for a reason that has nothing to do with the change.
      #
      # A dependency joins the FIRST group whose patterns match, so these are
      # listed before the catch-all below. That ordering is what lets them claim
      # their packages for every update type, major included, and leaves the
      # catch-all holding everything else.
      vite:
        patterns:
          - vite
          - '@vitejs/*'
          # vitest is part of this unit, not a separate tool: it runs on Vite's
          # own module graph and each major pins a Vite range — vitest 5 wants
          # vite 8. Bumped on its own it either duplicates Vite in the tree or
          # fails to resolve, which is the ERESOLVE above with different names.
          - vitest
          - '@vitest/*'
      linting-and-types:
        # eslint, its plugins, TypeScript and the parser that bridges them are
        # one unit: @typescript-eslint/parser pins a TypeScript range, and the
        # eslint plugins pin an eslint range. Bumping any one of them alone is
        # the same failure in a different place.
        patterns:
          - eslint
          - 'eslint-*'
          - '@typescript-eslint/*'
          - typescript
          - oxlint
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      xterm:
        patterns:
          - '@xterm/*'
      console-minor-and-patch:
        update-types: [minor, patch]
    # Grouping is not enough when the group has no version that agrees with
    # itself. These two majors have no installable combination at all, so
    # Dependabot proposes half the move and `npm ci` refuses the result — a
    # pull request nobody can merge and nobody can fix, reopened weekly.
    #
    # Each entry says what has to ship before it comes off. Neither is a
    # judgment that the major is unwanted.
    ignore:
      # TypeScript 7 is the Go rewrite. @typescript-eslint/parser has no release
      # that accepts it — 8.70.0 is the latest, there is no 9.x, and it peers
      # `typescript >=4.8.4 <6.1.0`. 6.0.3 is the highest version that installs
      # and is what the console is on.
      #
      # Remove when @typescript-eslint/parser peers a 7.x range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint 10 is blocked one plugin over: eslint-plugin-react@7.37.5 is the
      # latest and peers `... || ^9.7`. @typescript-eslint/parser already
      # accepts ^10, so this is the only thing holding it.
      #
      # This one has a cost — eslint 9 is now deprecated upstream ("no longer
      # supported"), so the console lints with a version that gets no fixes.
      # Remove as soon as eslint-plugin-react peers ^10, and if that release
      # does not come, the question is whether eslint-plugin-react is still
      # worth having rather than whether eslint should be upgraded.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /
      # BuildKit's manifest pins its image by digest, as the compose file does.
      - /deploy/kubernetes
    registries:
      - dhi
    schedule:
      interval: weekly
    ignore:
      # A new Postgres major cannot read the old one's data directory: moving
      # to it is a dump and restore, not a version bump (issue #130).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # BuildKit and Postgres are pinned by digest in docker-compose.yml (issue
  # #130). A digest nobody updates is a known vulnerability that stays, so
  # Dependabot moves the tag and the digest together.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ['*']
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
