name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here writes anything to the repository, and a
# workflow token that can is a workflow token an action can misuse.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # A build cache of this job's own, below, for the reason the
          # integration job has one: setup-go's is keyed on go.sum alone and
          # shared by every job, so it rarely holds what this job compiles.
          cache: false
      # Restored on every run; saved only from main (the last step). A pull
      # request starts from main's latest and recompiles what it changed, and
      # does not spend the repository's cache space on a copy of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-check-${{ runner.os }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Includes the depguard rule enforcing R-027: adapters may not import
      # core/authz, core/audit, core/state, or core/policy — and gosec, the
      # fast static analysis pass for common vulnerability classes. CodeQL runs
      # separately and does the dataflow this cannot.
      #
      # .golangci.yml is v2 format, which needs golangci-lint v2 and action v7+.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

      # Functions nothing calls. Knip does the same for the console, in the
      # console job's `npm run check`.
      - name: Dead code
        run: make deadcode

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      # For the codecov and sonar jobs below, which report the coverage these
      # tests measured rather than running them again. always(), because the
      # profile is written as the tests run: a failing package would otherwise
      # discard the coverage of every package that passed.
      - name: Keep coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-go-unit
          path: coverage.out
          retention-days: 1
          if-no-files-found: ignore

      # Design 00 §4: CI reports which requirements have a named acceptance test.
      - name: Requirement coverage
        run: make requirements-coverage

      # The release config is only exercised by a tag, which is the worst time
      # to find out it stopped parsing.
      - name: Release config is valid
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: check

      - name: Traceability index is up to date
        run: |
          make requirements-index
          git diff --exit-code docs/traceability/requirements-index.md \
            || { echo "::error::Run 'make requirements-index' and commit the result."; exit 1; }

      # The API, CLI and MCP reference is generated from the code that serves
      # it, and the console reads the same document from the running binary.
      # This is what keeps the repository's copy from describing a version of
      # Pando that no longer exists (R-261).
      - name: Reference is up to date
        run: |
          make reference
          git diff --exit-code docs/api.md docs/cli.md docs/mcp.md \
            || { echo "::error::Run 'make reference' and commit the result."; exit 1; }

      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-check-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  console:
    runs-on: ubuntu-latest
    # The console's checks are its own job because they need Node rather than
    # Go, and because a Go developer running `make check` should not need npm.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci
        working-directory: console

      # Brand adherence: a raw hex value, a raw px value or a font that is not
      # Newsreader / Public Sans / IBM Plex Mono fails here, the way the
      # depguard rule fails for R-027. Plus TypeScript against the design
      # system's own 24 declaration files, which is what checks component props.
      - run: npm run check
        working-directory: console

      # The same profile, for the sonar job below: SonarCloud reads the
      # coverage these tests already measured rather than running them again.
      - name: Keep coverage for SonarCloud
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-console
          path: console/coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

      # The generated API types must match the Go types they came from. R-261
      # makes the API authoritative, and a stale checked-in type is the drift
      # the generator exists to prevent.
      - name: Generated API types are up to date
        working-directory: console
        run: |
          npm run types
          git diff --exit-code src/api/types.gen.ts \
            || { echo "::error::Run 'npm run types' in console/ and commit the result."; exit 1; }

      - run: npm run build
        working-directory: console

  integration:
    runs-on: ubuntu-latest
    # Real Postgres and real Docker, via testcontainers. The four sequences in
    # docs/design/07-sequences.md are the acceptance criteria for v1.
    #
    # Not the detection corpus: it clones ten real repositories and was 71% of
    # this job's runtime, on every push, for twenty statements nothing else
    # covers. It runs nightly in corpus.yml instead, and on a pull request that
    # touches detection.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # Not setup-go's cache: its key is go.sum alone, shared with every
          # other job and saved only when that key is new, so what this job
          # restored was whichever job ran first on the day go.sum last
          # changed — none of the race-built, coverage-instrumented packages
          # this job compiles. Compiling was two minutes of every run (#31).
          cache: false
      # A build cache of this job's own, restored from main's most recent run
      # and saved only from main, as the check job's is.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-integration-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-integration-${{ runner.os }}-
      # Runners have Docker, so testcontainers works without extra setup.
      - run: make test-integration COVERPROFILE=coverage.integration.out
        env:
          # No Ryuk reaper here. It removes containers a run leaves behind,
          # and a runner is thrown away after the job, so on CI it guards
          # nothing — and it was two ways to fail a package that had nothing
          # wrong with it: attaching to a reaper as it shut down, and the
          # reaper's own host port being taken (statetest.Postgres). Local
          # runs keep it, because there it is what cleans up.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      # For the codecov and sonar jobs below, which report the coverage these
      # tests measured rather than running them again. always(), because the
      # profile is written as the tests run: a failing package would otherwise
      # discard the coverage of every package that passed.
      - name: Keep coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-go-integration
          path: coverage.integration.out
          retention-days: 1
          if-no-files-found: ignore

      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-integration-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # Codecov, from one job once both Go test jobs are done, rather than from
  # each as it finishes. codecov.yml waits for two uploads before it reports,
  # but uploaded from the jobs themselves the unit profile still drew a failing
  # codecov/patch minutes before the integration profile arrived: the lines
  # only an integration test reaches read as uncovered. Integration goes first.
  # The unit flag is never carried forward, so nothing can stand in for it,
  # and Codecov has both real uploads before it can report.
  #
  # Two flags, not one merged profile: merging would report a number neither
  # job measured. Codecov takes the union, and every line it counts was
  # executed by a test that ran. Without the integration flag the packages that
  # need Postgres or Docker — the API handlers, the state store, the runtime
  # adapter — read as untested when they are not.
  codecov:
    runs-on: ubuntu-latest
    needs: [check, integration]
    if: ${{ !cancelled() }}
    # id-token to prove to Codecov which repository and workflow this upload
    # comes from (OIDC), instead of a stored upload token. A token is a secret
    # that can be lost — it was, when the repository moved to trypando — and a
    # protected branch refuses a tokenless upload. Nothing here writes to the
    # repository; contents stays read.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-go-*
          merge-multiple: true
          path: coverage

      - name: Upload integration coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: coverage/coverage.integration.out
          flags: integration
          fail_ci_if_error: false

      - name: Upload unit coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: coverage/coverage.out
          flags: unit
          fail_ci_if_error: false

  # SonarCloud, analyzed here rather than by its Automatic Analysis, because
  # Automatic Analysis cannot read coverage. It takes the profiles the jobs
  # above wrote — Go unit and integration, the console's lcov — so no test runs
  # twice. sonar-project.properties says where each one lands.
  #
  # Runs when a job above failed too, with whatever coverage there is: a failed
  # test is not a reason to skip the analysis. Without SONAR_TOKEN (a fork, or
  # Dependabot) it says so and stops, as the image job does.
  sonar:
    runs-on: ubuntu-latest
    needs: [check, console, integration]
    if: ${{ !cancelled() }}
    steps:
      - name: Token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::No SONAR_TOKEN available to this run, so SonarCloud is not analyzed here."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history: SonarCloud decides what is new code from blame.
      - if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - if: steps.token.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The server image, built from this change and run the way an operator runs a
  # release: from the compose file a release ships, made to deploy an app and
  # serve it (scripts/smoke-image.py). The release runs the same test against
  # the image it pushes; this catches an image that cannot host an app before
  # it is released (issue #52).
  #
  # The Dockerfile builds on Docker Hardened Images, which dhi.io serves only to
  # a signed-in Docker account. A pull request from a fork, or one Dependabot
  # opens, gets no secrets, so it cannot pull them: the job says so and stops
  # rather than failing on something the change did not do. The release builds
  # and tests the image regardless.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Registry access
        id: dhi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::notice::No Docker account available to this run, so the hardened base images cannot be pulled and the image is not built here."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dhi.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Go's build cache, kept between runs. The Dockerfile mounts it as a
      # cache mount, which no layer holds, so a layer cache cannot carry it: a
      # source change reruns the stages that compile, and without it they
      # compiled every dependency from nothing. (A layer cache was tried first,
      # #31, and was slower than no cache: those stages rerun anyway and
      # exporting it cost nearly a minute.)
      #
      # The build cache only. The module and npm caches mostly hold what `go
      # mod download` and `npm ci` fetch in seconds, and moving a directory
      # into and out of the builder costs time in proportion to its size.
      - if: steps.dhi.outputs.available == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Saved only from main, like the Go jobs' caches: a pull request restores
      # main's latest. Here that also skips taking the cache back out of the
      # builder, which is the slow half.
      - if: steps.dhi.outputs.available == 'true' && github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image-cache/go-build
          key: image-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-build-${{ hashFiles('go.sum') }}-
            image-go-build-
      - if: steps.dhi.outputs.available == 'true' && github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image-cache/go-build
          key: image-go-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-build-${{ hashFiles('go.sum') }}-
            image-go-build-

      # Moves that directory into the builder's cache mount before the build,
      # and on main back out after it. The utility image is pinned like every
      # other image this repository runs; the action's default is a moving tag.
      - if: steps.dhi.outputs.available == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          utility-image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          skip-extraction: ${{ github.event_name != 'push' }}
          cache-map: |
            {
              "image-cache/go-build": "/cache/go-build"
            }

      - name: Build date
        if: steps.dhi.outputs.available == 'true'
        run: echo "build_date=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Build
        if: steps.dhi.outputs.available == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: trypando/pando:0.0.0-ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.build_date }}

      - name: Smoke test
        if: steps.dhi.outputs.available == 'true'
        run: |
          scripts/release-compose.sh 0.0.0-ci > "$RUNNER_TEMP/docker-compose.yml"
          python3 scripts/smoke-image.py "$RUNNER_TEMP/docker-compose.yml" --version 0.0.0-ci
