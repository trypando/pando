name: Container image

# Publishes the server as a prebuilt image, trypando/pando on Docker Hub, so an
# install is "download one compose file, `docker compose up -d`" rather than a
# clone and a build on the operator's machine (issue #52).
#
# Two ways in. release.yml calls it after a release is published, so every
# release gets its image. Or run it by hand for a version already released —
# which is how a release made before this workflow existed gets one. It is a
# called workflow rather than one triggered by the release being published
# because a release the workflow's own token publishes triggers no other
# workflow.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish the image for, with the v — v0.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE: trypando/pando

  # The Trivy the release gate runs is the one Pando runs against hosted apps
  # (internal/adapter/scanner/trivy defaultImage), so the bar is literally the
  # same. Bump the two together.
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # Attaching the compose file to the release.
      contents: write
      # Keyless signing, the same identity as the release's other artifacts.
      id-token: write
    steps:
      - name: Version
        id: v
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, or v1.2.3-rc.1. Got '$TAG'."
            exit 1
          fi
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A 0.x release gets no major tag: `0` would name every release
          # before 1.0, breaking ones included.
          if [[ "$version" == 0.* ]]; then echo "major=false" >> "$GITHUB_OUTPUT"; else echo "major=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}

      - name: Only a released version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::$TAG has no published release. The image follows a release; it does not make one."; exit 1; }
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "build_date=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # Trivy and the smoke test pull from Docker Hub before the sign-in that
      # pushes below, so they go through the mirror, signed in, like CI (#170).
      # The builder has a daemon of its own, so it is given the same mirror.
      - uses: ./.github/actions/docker-hub-pulls
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Every stage of the Dockerfile is a Docker Hardened Image, and dhi.io
      # serves them only to a signed-in Docker account. The same account pushes
      # the image below.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scanned before anything is pushed: an image that fails the gate is
      # never published, rather than published and then withdrawn.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pando-scan:${{ steps.v.outputs.version }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ env.commit }}
            BUILD_DATE=${{ env.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "pando-scan:${{ steps.v.outputs.version }}"

      # And made to work before anything is pushed: the same image, run from a
      # compose file shaped like the one the release ships, deploying an app.
      # An image that cannot is never published.
      - name: Smoke test before publishing
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          scripts/release-compose.sh "$VERSION" pando-scan > "$RUNNER_TEMP/local-compose.yml"
          python3 scripts/smoke-image.py "$RUNNER_TEMP/local-compose.yml" --version "$VERSION"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 0.3.0, 0.3 and, from 1.0 on, 1; latest for a stable release. A
      # prerelease gets its own version tag and nothing else, so nobody on
      # `latest` or `0.3` is moved onto it.
      #
      # Only the exact version is pushed at first. The moving tags — the minor
      # line, the major, latest — are the ones people follow without choosing a
      # build, so they move last, once the published image has passed its smoke
      # test (Promote, below). A failure leaves them where they were.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.v.outputs.tag }},enable=${{ steps.v.outputs.major }}
            type=raw,value=latest,enable=${{ !contains(steps.v.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Pando
            org.opencontainers.image.description=Deploy and share apps on a host you own
            org.opencontainers.image.url=https://trypando.ai
            org.opencontainers.image.source=https://github.com/trypando/pando
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ env.commit }}
            org.opencontainers.image.created=${{ env.build_date }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ env.commit }}
            BUILD_DATE=${{ env.build_date }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest, so the signature covers exactly what was pushed and every
      # tag later pointed at it.
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The published image, pulled back from Docker Hub by its exact version,
      # run from the compose file an operator downloads, and made to deploy an
      # app: the multi-arch manifest and the push itself, which the test before
      # publishing could not see.
      - name: Smoke test the published image
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Written outside the checkout. The script reads docker-compose.yml
          # from it, and a redirect onto that same file empties it before the
          # script runs, which is how the v0.3.0 release lost its compose file.
          mkdir -p "$RUNNER_TEMP/release"
          scripts/release-compose.sh "$TAG" "$IMAGE" > "$RUNNER_TEMP/release/docker-compose.yml"
          python3 scripts/smoke-image.py "$RUNNER_TEMP/release/docker-compose.yml" --pull --version "$VERSION"

      # The compose file is attached only once the image it names has passed,
      # so the release's install instructions never lead to a failing image.
      - name: Attach the compose file to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/release/docker-compose.yml" --clobber --repo "$GITHUB_REPOSITORY"

      # Now the moving tags: every tag metadata-action named except the exact
      # version, which is already there. They are pointed at the same digest,
      # so the signature and the attestations already cover them; the check
      # after says so rather than assuming it.
      - name: Promote
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for t in $TAGS; do
            [ "$t" = "${IMAGE}:${VERSION}" ] || args+=(-t "$t")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "A prerelease: no moving tags."
            exit 0
          fi
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for t in $TAGS; do
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$t points at $got, not the signed $DIGEST."
              exit 1
            fi
            echo "$t -> $DIGEST"
          done
