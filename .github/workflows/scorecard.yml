# OpenSSF Scorecard. Scores the repository's supply-chain posture — branch
# protection, pinned dependencies, signed releases, token permissions, whether a
# security policy exists — and publishes the result.
#
# It measures the same ground as the OpenSSF Best Practices badge from the other
# direction: the badge is what the project asserts, Scorecard is what a tool can
# observe without being told. Where they disagree, Scorecard is usually right.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 2' # weekly

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to the Security tab
      id-token: write # publish the result so the score badge resolves
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to an exact release. scorecard-action publishes no floating `v2`
      # tag, so `@v2` fails to resolve before the job starts — which is how this
      # was found, on main, after the workflow merged.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
