# CodeQL. Static analysis for common vulnerability classes — injection, path
# traversal, unsafe deserialization, hardcoded credentials — across both
# languages in the repository.
#
# This is the "beyond compiler warnings and safe language modes" analysis.
# `gosec` runs inside `make lint` and catches a narrower, faster set; CodeQL
# does the interprocedural dataflow that a per-file linter cannot. Findings land
# in the repository's Security tab. See SECURITY.md.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query in a CodeQL release is applied to code that has not
    # changed. Most rules land this way rather than on a commit.
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the lower-precision security queries. The
          # extra noise is worth it here: the proxy and the authorization code
          # are where a false negative costs the most.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
