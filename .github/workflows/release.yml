name: Release

# Two ways in, one job.
#
# Normally: run this workflow from main with a version, and it creates the tag
# and releases it. Merging a pull request does not release anything, because
# which version a change is worth is a judgment nobody should automate away.
#
# Or push a `v*` tag by hand and this runs on it, which is the escape hatch when
# the tag has to point somewhere other than the head of main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with the v — v0.1.0, or v0.1.0-rc.1 for a prerelease'
        required: true
        type: string

# Read-only by default, with the writes granted on the one job that needs them.
# A top-level write is inherited by every job a workflow ever grows, including
# the one somebody adds later without thinking about the token.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and publishing the release.
      contents: write
      # Keyless signing: cosign exchanges this job's OIDC token for a
      # short-lived Fulcio certificate. Without it the `signs` block in
      # .goreleaser.yaml fails.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser needs the full history to build a changelog, and the tags
          # to work out the version.
          fetch-depth: 0

      # Only on a manual run. On a tag push the tag is already the reason we are
      # here.
      #
      # The tag is pushed with GITHUB_TOKEN, and a push made with GITHUB_TOKEN
      # deliberately does not start another workflow run. That is what keeps the
      # `push: tags` trigger above from firing a second, duplicate release.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Release from main. This run is on ${{ github.ref }}."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, or v1.2.3-rc.1 for a prerelease. Got '$VERSION'."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged. A released version is never re-cut; pick the next one."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The console is embedded in the binary, so the release build needs Node
      # even though nothing else about a Go release does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      # Signs checksums.txt. Installed before GoReleaser, which shells out to it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Release notes come from CHANGELOG.md, not from the commit log.
      #
      # Written to RUNNER_TEMP rather than the working tree. GoReleaser refuses
      # to build from a dirty checkout — a modified or untracked file means the
      # artifacts would not match the tag — and an untracked notes.md in the
      # repository root is exactly that. It failed the first v0.1.1 attempt.
      #
      # GoReleaser's generated changelog is one line per commit — subject, SHA
      # and author email — which is a version control log with bullet points,
      # not something an operator can read to decide whether to upgrade. It is
      # also what the OpenSSF passing criteria rule out by name.
      #
      # Failing when the section is missing is the point: a release whose notes
      # would be a commit log is a release that should not be cut yet.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before releasing (docs/releasing.md)."
            exit 1
          fi
          echo "Release notes for $version:"
          cat "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on trypando/homebrew-tap. Without it the
          # release fails at the cask step: GITHUB_TOKEN is scoped to this
          # repository and cannot push to the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A manual run pushes the tag before building, so a build that then fails
      # leaves a tag on a version nobody can install — and leaves the next
      # attempt at that version refused as already tagged.
      - name: Clean up a tag that released nothing
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Not unconditionally: the likeliest failure is the cask push, which
          # happens after the release is published. That release is real and
          # people can already install it, so its tag has to stay.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$VERSION was published before the failure, so the tag stays. Fix the failure and re-run this job."
            exit 0
          fi
          git push --delete origin "$VERSION" || true
          echo "::notice::Removed the tag $VERSION, because nothing was released under it."

  # The server image, once the release it belongs to is published. A separate
  # job so a failure here leaves the release standing and can be re-run on its
  # own; see image.yml.
  image:
    needs: release
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    secrets: inherit

  # trypando.ai publishes these docs from the latest release and shows its
  # version. Tell it a release is out once the image the site's install command
  # pulls exists. A prerelease isn't the latest release, so the site has
  # nothing to update. The token can only dispatch to that one repository.
  site:
    needs: image
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tell trypando.ai
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api repos/trypando/trypando.ai/dispatches -f event_type=pando-release
