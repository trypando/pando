# Detection against real repositories.
#
# Its own workflow because it does not belong on the push path. It clones ten
# real projects, which made it 425 of the 597 seconds the integration job spent
# — 71%, waiting on one package, on every push — and it depends on ten
# third-party repositories staying reachable, so a red result here is as likely
# to be GitHub having a bad afternoon as it is to be a detector regression.
#
# What it buys is not coverage. Measured against the whole rest of the suite it
# reaches twenty statements nothing else does, all in internal/detect: compose
# `environment` written as a list rather than a map, `depends_on` in long form,
# and a Cargo workspace. What it buys is the shape of repositories nobody
# thought to write a fixture for — which is how it found three detector defects
# the unit tests had not.
#
# So it still runs, nightly, and on a pull request that touches detection. It
# is deliberately NOT in the required checks: the questions-per-deploy budget
# is a number to watch rather than a merge gate, and a check that goes red
# because somebody else deleted a repository should not stop a release.

name: Detection corpus

on:
  schedule:
    - cron: '41 4 * * *' # daily, offset from the other scheduled workflows
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/detect/**'
      - 'test/corpus/**'
      - '.github/workflows/corpus.yml'

permissions:
  contents: read

jobs:
  corpus:
    name: Detection corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # -v, so the per-case table and the aggregate land in the log. The number
      # this exists to report — questions per deploy — is in that output and
      # nowhere else.
      - run: make detection-corpus
