blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/trypando/pando/security/advisories/new
    about: >-
      Privately, through GitHub's advisory form — not as an issue. A public
      issue describes the bug before anyone can upgrade. See SECURITY.md.

  - name: Suggest an idea
    url: https://github.com/trypando/pando/discussions/new?category=ideas
    about: >-
      Something Pando should do and does not. Ideas start as discussions; one
      that is taken up becomes an issue.

  - name: Ask a question
    url: https://github.com/trypando/pando/discussions
    about: >-
      For "how do I" and "should this work this way". If the answer turns out
      to be a bug, open an issue then.
