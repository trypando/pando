# Release build. Produces the artifacts a tag is expected to produce: signed-by-
# checksum archives for macOS, Linux and Windows, Linux packages, and a Homebrew
# cask.
#
# What this ships is the CLI. Pando the *server* is installed with the Compose
# file (design 00 §1.1) — it needs Postgres, a container runtime and Railpack,
# none of which a package manager is going to supply. The binary is the same
# binary either way (R-253), so `pando serve` works from a Homebrew install if
# you bring your own Postgres; it is just not the path the docs point at.
#
# Dry run without publishing anything: `make release-snapshot`.
version: 2

project_name: pando

before:
  hooks:
    - go mod download
    # The console is embedded (internal/console) and the checked-in dist holds
    # only a README, so a release binary without this step serves the "console
    # was not built" message instead of the console.
    - make console

builds:
  - id: pando
    main: ./cmd/pando
    binary: pando
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.buildVersion={{ .Version }}
      - -X main.buildCommit={{ .FullCommit }}
      - -X main.buildDate={{ .CommitDate }}
    # Reproducible: the timestamp comes from the commit rather than the clock.
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - darwin
      - linux
      # The CLI only. An MCP client on Windows, such as Claude Desktop, launches
      # `pando mcp` itself and has nothing to launch without this.
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: pando
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSING.md

checksum:
  name_template: checksums.txt

# A checksum file served from the same place as the artifacts proves only that
# the server is self-consistent: anyone who can replace the tarball can replace
# checksums.txt beside it. Signing it is what makes the check mean something.
#
# Keyless, so there is no long-lived signing key to leak, rotate or lose. cosign
# gets a short-lived certificate from Fulcio bound to this workflow's OIDC
# identity and records it in Rekor, so verification asks "was this produced by
# Pando's release workflow, from a tag" rather than "do I have the right key".
# Requires `id-token: write` on the job.
#
# Verification is in docs/releasing.md.
signs:
  # One Sigstore bundle, checksums.txt.sigstore.json, holding the signature,
  # the certificate and the transparency log entry. cosign 3 (cosign-installer
  # 4) writes this format by default and refuses to sign without a --bundle
  # path; the separate .sig and .pem the 0.1 releases carried came from cosign
  # 2's flags, and asking cosign 3 for them failed the 0.2.0 release with
  # "create bundle file: open : no such file or directory".
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    output: true
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

# Only a fallback. The workflow passes --release-notes with the CHANGELOG.md
# section for the version being released, which takes precedence over anything
# generated here — and a generated changelog is a commit log, which is not what
# release notes are for.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# brew install trypando/tap/pando
#
# A tap rather than homebrew-core: core has notability requirements a new
# project does not meet, and core builds from source, which for Pando means a
# Node toolchain to build the console before the Go build. Revisit when the
# project is established enough for core to accept it.
homebrew_casks:
  - name: pando
    ids: [pando]
    repository:
      owner: trypando
      name: homebrew-tap
      # A PAT with contents:write on the tap repository. The default
      # GITHUB_TOKEN cannot push to another repository.
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/trypando/pando
    description: Deploy applications to a host you own
    license: AGPL-3.0-only
    binaries:
      - pando
    hooks:
      post:
        # The binaries are not signed with a Developer ID, so macOS quarantines
        # them and Gatekeeper refuses to run them. Removing the attribute is
        # what every unsigned cask does; it is also a real weakening of the
        # check, and the fix is signing and notarization rather than this.
        # Homebrew's install-steps DSL, which replaced arbitrary Ruby in
        # postflight (goreleaser v2.19).
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/pando"]
          end

# .deb, .rpm and .apk attached to the release. Installable today with
# `sudo apt install ./pando_<version>_amd64.deb`; a hosted apt repository that
# would make `apt install pando` work is O-18, still open.
nfpms:
  - id: pando
    ids: [pando]
    package_name: pando
    # Named like the archives rather than by each packager's convention, which
    # is goreleaser's default: conventional naming gives a .deb
    # `pando_1.2.3_amd64.deb` and an .rpm `pando-1.2.3.x86_64.rpm`, so the
    # download line in the documentation would have to be a different line per
    # format and per architecture, spelled from memory. One template means one
    # documented name, and `TestInstallInstructionsMatchWhatATagPublishes`
    # checks the documentation against this line.
    file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    vendor: Bemeek
    homepage: https://github.com/trypando/pando
    maintainer: Ben Meeker <ben@benmeeker.com>
    description: |
      Deploy applications to a host you own.
      This package installs the pando CLI. The server is installed with the
      project's Compose file, which supplies the Postgres it needs.
    license: AGPL-3.0-only
    section: utils
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/pando/LICENSE
      - src: LICENSING.md
        dst: /usr/share/doc/pando/LICENSING.md
      - src: README.md
        dst: /usr/share/doc/pando/README.md

release:
  github:
    owner: trypando
    name: pando
  # A tag with a suffix (v1.0.0-rc.1) is published as a prerelease, and a
  # prerelease is not what `brew upgrade` or a package manager should pick up.
  prerelease: auto
