# SonarCloud, run from CI (the sonar job in .github/workflows/ci.yml) so that
# it can read the coverage the other jobs measure. Automatic Analysis must be
# off in the project's settings, or the scan refuses to run.

sonar.projectKey=trypando_pando
sonar.organization=trypando

# Everything is source except tests, which are listed separately so their
# lines are not counted as code needing coverage. A file is indexed once, so
# the test patterns are excluded from sources as well.
#
# console/src/main.tsx is left out because the JS security sensor starts its
# React render simulation there, walks the whole console from <App />, and
# never finishes: it stops at its fixed 300-second limit, five of the scan's
# six and a half minutes, on a file of forty lines that creates a QueryClient
# and mounts the app. Every other file is still analyzed, its security rules
# included.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,test/**
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,test/**,**/node_modules/**,coverage/**,console/coverage/**,internal/console/dist/**,console/src/main.tsx,.claude/skills/pando-doc-writer/**

# Written by the check, integration and console jobs and downloaded into
# coverage/ by the sonar job. Go profiles name files by import path, which the
# scanner resolves through go.mod; the lcov report names them from the
# repository root (console/vite.config.ts).
sonar.go.coverage.reportPaths=coverage/coverage.out,coverage/coverage.integration.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python under scripts/ is tooling run by hand or by CI (release-compose,
# smoke-image, buildkit-seccomp, the requirements index), and nothing measures
# its coverage, so every new line of it reads as uncovered. Still analyzed for
# bugs and security issues; only left out of the coverage condition. What a
# script produces is what is tested: BuildKit's seccomp profile by
# TestR111_TheBuildKitSeccompProfileAddsOnlyWhatRootlessNeeds, smoke-image.py
# by running in the image job.
#
# The design system under .claude/skills/pando-design is imported from the
# design project and copied into console/src/design at build time, so the
# console's tests run it from there and lcov names that gitignored path; Sonar
# reads the copy in git and finds no coverage for it. The console's tests still
# exercise it (console/src/ui/RouteLink.test.tsx drives SidebarNav, Tabs and
# Table); only left out of the coverage condition.
sonar.coverage.exclusions=scripts/**,.claude/skills/pando-design/**

# An adapter kind's guided setup (api.KindInfo.Steps) is declared in its
# package's steps.go: declarative text, one api.Step literal to a step, whose
# struct shape repeats from kind to kind by design. KindInfo.Validate and
# TestR261_EveryKindHasGuidedSetup check it, and text shared between kinds
# lives in helpers (forgekit, aikit) rather than in copies. Still analyzed for
# issues; only left out of duplication.
sonar.cpd.exclusions=internal/adapter/**/steps.go

# docker:S8431 asks for an image's tag or its digest, not both. Every image
# here is pinned as tag@digest on purpose: the digest fixes the bytes, and the
# tag is what Dependabot reads to move the digest forward (.github/dependabot.yml).
# A digest alone would never get a security update, which is the failure the
# rule exists to prevent.
#
# go:S5332 asks for https in a URL. SAML attribute names are URIs that are
# never fetched, and a provider's spelling of one is matched exactly:
# authentik sends http://schemas.goauthentik.io/2021/02/saml/username, and the
# https spelling would match nothing. A local model server is reached over
# plain http on the host or the LAN, which is what the local AI adapter's
# setup steps show, so its example address is http too.
sonar.issue.ignore.multicriteria=tagdigest,samlattr,localai,sqlliteral,combolist,netpool,sidepanel,auditpanel,unsaveddot,ifacename,ctxwriter,ctxreader,pinnedtls,livenesssim
sonar.issue.ignore.multicriteria.tagdigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagdigest.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.samlattr.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.samlattr.resourceKey=internal/adapter/identity/saml/info.go
sonar.issue.ignore.multicriteria.localai.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.localai.resourceKey=internal/adapter/ai/local/steps.go

# plsql:S1192 asks for a constant in place of a repeated literal. A migration is
# one SQL statement run once, in a language without constants; a JSON key named
# three times in one UPDATE is clearer spelled out than hidden in a psql variable.
sonar.issue.ignore.multicriteria.sqlliteral.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqlliteral.resourceKey=migrations/**

# typescript:S6819 asks for a native <select> or <datalist> in place of
# role="listbox". ComboList is the popup of a WAI-ARIA combobox: a text input
# whose options the server searches as it is typed in, followed by the input's
# aria-activedescendant. A <select> has no text input and a <datalist> takes
# neither, so the role is the accessible form here, not a substitute for one.
sonar.issue.ignore.multicriteria.combolist.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.combolist.resourceKey=console/src/ui/ComboOption.tsx

# go:S1313 asks whether a hardcoded IP address is safe. internal/dockernet's
# DefaultPool is the private range Pando carves its own Docker networks from,
# a default an operator overrides (PANDO_RUNTIME_NETWORK_POOL,
# PANDO_BUILDKIT_NETWORK_POOL), not an address anything connects to.
sonar.issue.ignore.multicriteria.netpool.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.netpool.resourceKey=internal/dockernet/dockernet.go

# typescript:S6819 asks for a native <dialog> in place of role="dialog". The
# side panel (ui/SidePanel.tsx) and the audit log's event panel and filter
# popovers (install/AuditLog.tsx) are positioned and styled divs that move
# focus in themselves and close on Escape through their own listeners, which
# a terminal in the panel is exempt from. A <dialog> opened with showModal()
# brings its own top layer, inert background, backdrop and Escape handling,
# and one opened without it its own user-agent styles: either changes how the
# panels behave and look. The role is what describes them to assistive
# technology without that.
sonar.issue.ignore.multicriteria.sidepanel.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.sidepanel.resourceKey=console/src/ui/SidePanel.tsx
sonar.issue.ignore.multicriteria.auditpanel.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.auditpanel.resourceKey=console/src/install/AuditLog.tsx

# typescript:S6819 asks for <img alt> in place of role="img". The System
# page's unsaved-changes mark (install/System.tsx) is a dot drawn in CSS, with
# no image to load; an <img> without a source shows a broken image instead.
# role="img" with aria-label is how a drawn mark is named.
sonar.issue.ignore.multicriteria.unsaveddot.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.unsaveddot.resourceKey=console/src/install/System.tsx

# godre:S8196 asks that a one-method interface be named for its method with
# -er. Core's interfaces are named for what they provide to the code that
# holds them (Revisions, Backups, Homes, Store), across the whole tree; a
# second naming scheme for the ones that happen to have one method would make
# the same kind of dependency read two ways.
sonar.issue.ignore.multicriteria.ifacename.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.ifacename.resourceKey=**/*.go

# godre:S8242 asks that a context be passed to methods, not kept in a struct.
# The S3 upload is an io.WriteCloser and the upload store's reader an
# io.ReadCloser: Write, Read and Close take no context, so the one the stream
# was opened with is kept for them, and cancelling it cancels the transfer.
sonar.issue.ignore.multicriteria.ctxwriter.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.ctxwriter.resourceKey=internal/adapter/backup/s3/upload.go
sonar.issue.ignore.multicriteria.ctxreader.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.ctxreader.resourceKey=internal/core/state/uploads.go

# go:S4830 asks that server certificates be validated. A joining host has no
# CA yet, only the SHA-256 of its public key in the join token (R-415, as in
# kubeadm). hosts.PinnedTLS turns the default check off and replaces it with
# VerifyConnection, which refuses the server unless its chain verifies against
# the one authority whose key hashes to the token's, before anything is sent.
sonar.issue.ignore.multicriteria.pinnedtls.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.pinnedtls.resourceKey=internal/core/hosts/issue.go

# go:S3776 asks for less branching in a function. The liveness tests drive a
# simulated cluster through a table of partitions, clock jumps and flapping
# links (R-421); each step's branches are the cases the table names, and
# splitting them would hide which case a step checks.
sonar.issue.ignore.multicriteria.livenesssim.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.livenesssim.resourceKey=internal/core/liveness/*_test.go
