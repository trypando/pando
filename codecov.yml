# Two uploads make one report: the check job's unit profile (flag "unit") and
# the integration job's (flag "integration"), which finishes minutes later.
# Codecov reports on whatever it has when an upload lands, so without this the
# unit upload alone posted a failing status and comment, judged against a
# baseline that included the integration coverage, and corrected itself only
# when the second arrived. It now waits for both.
codecov:
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2
