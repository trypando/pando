# The install registry (notes-image-registry-issue-72.md): CNCF Distribution,
# plain HTTP, no persistence — the test's only.
#
# Every node's containerd pulls `registry.pando.svc.cluster.local:5000/...`,
# a name only cluster DNS knows. setup.sh writes a hosts.toml on each node
# sending that name to the Service's fixed ClusterIP below, which a node
# reaches through kube-proxy: kind's local-registry pattern, with the
# registry inside the cluster rather than beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: pando
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: pando
spec:
  clusterIP: 10.96.0.50
  selector:
    app.kubernetes.io/name: registry
  ports:
    - port: 5000
      targetPort: 5000
---
# Pando lists and deletes manifests, BuildKit pushes, and every node pulls.
# Nothing in an app namespace reaches it (the image registry note, "Apps never
# hold a registry credential and never reach the registry").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  namespace: pando
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pando
              app.kubernetes.io/component: server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pando-build
          podSelector:
            matchLabels:
              app.kubernetes.io/name: buildkit
        # kind's nodes, pulling through the ClusterIP.
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - port: 5000
