apiVersion: v1
kind: ConfigMap
metadata:
  name: pando-config
  namespace: pando
data:
  pando.yaml: |
    adapters:
      rt_kubernetes:
        category: runtime
        kind: kubernetes
        name: Kubernetes
        default: true
        config:
          # kind's ranges (kind.yaml).
          pod_cidr: 10.244.0.0/16
          service_cidr: 10.96.0.0/12
          egress_gateway_image: pando-k8s-test/pando:dev
          # kind has no load balancer; the test reaches the edge's
          # NodePort Service by port-forward.
          edge_service_type: NodePort
          volume_size_bytes: 104857600
      rte_traefik:
        category: routing
        kind: traefik
        name: Traefik
        default: true
        config:
          delivery: kubernetes_api
          # Pando's certificate issuer orders only from Let's Encrypt: no
          # setting points it at a test CA such as Pebble yet, and the test
          # must not order real certificates.
          certificates: none
          console_hostname: pando.pando.test
          base_domain: apps.pando.test
