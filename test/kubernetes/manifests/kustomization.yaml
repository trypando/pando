# deploy/kubernetes as `make test-kubernetes` runs it on kind: the shipped
# manifests unchanged, plus what an operator would supply — Postgres, a
# registry, a ReadWriteMany volume — and Pebble as the edge's certificate
# authority, with the few settings the shipped files tell an operator to set.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy/kubernetes
  - postgres.yaml
  - registry.yaml
  - shared-volume.yaml
  - pebble.yaml
images:
  # Built from the checkout and loaded into the nodes by setup.sh.
  - name: ghcr.io/trypando/pando
    newName: pando-k8s-test/pando
    newTag: dev
patches:
  - path: pando-patch.yaml
  - path: config-patch.yaml
  # The shipped claim, bound to the shared volume.
  - target:
      kind: PersistentVolumeClaim
      name: pando-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: pando-shared
      - op: add
        path: /spec/volumeName
        value: pando-data
