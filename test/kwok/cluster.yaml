# What the scale harness needs in the kwok cluster beside its fake nodes
# (test/kwok/run.sh): Pando's and the edge's namespaces, the ClusterRole the
# runtime binds in every app namespace, and Traefik's IngressRoute kind. The
# CRD is the smallest that accepts what the Traefik adapter writes, so the run
# needs nothing from the network; its objects cost the API server and etcd
# what Traefik's own CRD's do.
apiVersion: v1
kind: Namespace
metadata:
  name: pando
---
apiVersion: v1
kind: Namespace
metadata:
  name: pando-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pando-app-manager
rules:
  - apiGroups: [""]
    resources: [pods, services, secrets, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressroutes.traefik.io
spec:
  group: traefik.io
  names:
    kind: IngressRoute
    listKind: IngressRouteList
    plural: ingressroutes
    singular: ingressroute
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
