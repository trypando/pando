# The load harness's balancer: test/replicas/haproxy.cfg, sized for load.
#
# Three differences, each because the replicas test's settings would measure
# the balancer instead of Pando:
#   - up to 32 replicas rather than 4;
#   - connection limits well above the harness's concurrency;
#   - kept-alive connections to the replicas (http-reuse) rather than a new
#     one per request, as a Kubernetes Service or cloud balancer would keep.
#     HAProxy still chooses a replica for every request.
global
    log stdout format raw local0
    # HAProxy needs about two descriptors per connection, and refuses to start
    # if the container's limit (nofile, docker-compose.load.yml) is lower.
    maxconn 50000

defaults
    mode http
    log global
    # Per-request logging at thousands of requests a second is the
    # balancer's own load; errors still show in the harness's report.
    option dontlog-normal
    option httplog
    option redispatch
    retries 3
    maxconn 50000
    http-reuse safe
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-keep-alive 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    accepted_payload_size 8192

frontend api
    bind :8080
    default_backend pando

frontend apps
    bind "*:${APP_PORTS}"
    default_backend pando_ports

backend pando
    balance roundrobin
    option httpchk GET /healthz
    server-template pando 32 pando:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr none

backend pando_ports
    balance roundrobin
    server-template pando 32 pando check port 8080 inter 1s fall 2 rise 1 resolvers docker init-addr none
