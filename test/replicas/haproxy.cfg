# A load balancer in front of every Pando replica (issue #72), as a Kubernetes
# Service or any L7 balancer would be.
#
# HTTP mode and a new choice of replica per request, so a test's requests are
# spread across replicas rather than pinned to whichever one its first
# connection reached. Server-sent events and websockets pass through.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option http-server-close
    option redispatch
    retries 3
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    accepted_payload_size 8192

# The API and console, and apps under the path prefix or a subdomain.
frontend api
    bind :8080
    default_backend pando

# Port-mode apps: every replica listens on every allocated port, so a request
# to one goes to the same port on any replica.
frontend apps
    bind "*:${APP_PORTS}"
    default_backend pando_ports

backend pando
    balance roundrobin
    option httpchk GET /healthz
    server-template pando 4 pando:8080 check inter 1s fall 2 rise 1 resolvers docker init-addr none

backend pando_ports
    balance roundrobin
    # No port on the server: each request goes to the port it arrived on.
    server-template pando 4 pando check port 8080 inter 1s fall 2 rise 1 resolvers docker init-addr none
