# Pando's install topology (design 00 §1.1).
#
# Two services that start together. The operator runs `docker compose up` and never
# encounters a connection string. This is what resolved O-11: Pando does not start
# Postgres — this file does — so Pando needs no runtime adapter to reach its own
# state store, and phase 0 depends on nothing from phase 3.
#
# To use an existing Postgres instead, drop the postgres service and set
# PANDO_DATABASE_URL. Read the privilege contract in design 00 §1.1 first: Pando
# must be able to create and constrain its restricted application role, or the
# audit log's immutability guarantee (R-027) does not hold. Pando verifies this at
# startup and refuses to run if it cannot.
#
# Bring the whole thing up with `docker compose up`.

services:
  pando:
    build: .
    # A model served on this machine, for the local AI adapter, whose default
    # address is host.docker.internal:11434 (Ollama). Docker Desktop provides
    # the name; on Linux this maps it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Compose starts both services at once. Pando also retries on its own rather
      # than trusting this healthcheck — see phase 0.
      #
      # No password in the URL: Pando reads it from the file the secrets service
      # wrote, so it is in neither this file nor `docker inspect` (issue #130).
      PANDO_DATABASE_URL: postgres://pando@postgres:5432/pando?sslmode=disable
      PANDO_DATABASE_PASSWORD_FILE: /run/pando-secrets/postgres-password

      # The initial admin password, read on first run only.
      #
      # `PANDO_ADMIN_PASSWORD=... docker compose up -d` still works, but the
      # password reaches Pando as a file (the admin-password config below)
      # rather than as an environment variable, so it is not in
      # `docker inspect` for the life of the container. Compose passes through
      # nothing it is not told to; that config is how it is told. Unset, the
      # file is empty and the administrator is set up in the console.
      PANDO_ADMIN_PASSWORD_FILE: /run/pando-input/admin-password
      # No build service here: Pando starts its own rootless BuildKit on the
      # Docker it runs apps on, as pando-buildkit (R-111). It has no runtime
      # socket (R-112), and runs under a seccomp profile compiled into Pando
      # (issue #130). Set PANDO_BUILDKIT_ADDRESS to use one you run instead.
      # Where per-app subdomains are carved from. localtest.me resolves every
      # subdomain to 127.0.0.1, so a laptop can exercise subdomain routing
      # without touching DNS or /etc/hosts.
      PANDO_SERVER_BASE_DOMAIN: ${PANDO_BASE_DOMAIN:-localtest.me}
      # Where routing adapters send traffic: always Pando's proxy (R-023).
      PANDO_SERVER_PROXY_UPSTREAM: http://pando:8080

      # Retry backoff (R-149) and the give-up rule (R-150). Unset here, so the
      # shipped defaults apply — they are the requirement.
      #
      # The acceptance suite is the reason these exist: at the real numbers,
      # TestR151_ACrashLoopingAppReachesFailedAndStaysThere is forty minutes of
      # a forty-three minute run, and it is asserting the state machine rather
      # than the durations. To run the suite quickly:
      #
      #   PANDO_RECONCILER_BACKOFF=0s,1s,2s,3s,4s       #   PANDO_RECONCILER_FAILURE_WINDOW=2m docker compose up -d
      #
      # Pando warns at startup if these are set faster than the default, because
      # an install retrying a broken app every second forever is a real way to
      # melt a host.
      PANDO_RECONCILER_BACKOFF: ${PANDO_RECONCILER_BACKOFF:-}
      PANDO_RECONCILER_FAILURE_WINDOW: ${PANDO_RECONCILER_FAILURE_WINDOW:-}
      PANDO_RECONCILER_FAILURE_THRESHOLD: ${PANDO_RECONCILER_FAILURE_THRESHOLD:-}
      PANDO_RECONCILER_GC_INTERVAL: ${PANDO_RECONCILER_GC_INTERVAL:-}
      # The CPU (thousandths of a core), memory and disk every new app is given
      # (R-240). Unset uses one core, 512 MiB and 10 GiB. Pando refuses a deploy
      # that would commit more than the host has (R-242), so on a small machine
      # running many light apps, lower the CPU: 250 fits four apps per core.
      PANDO_APPS_CPU_MILLIS: ${PANDO_APPS_CPU_MILLIS:-}
      PANDO_APPS_MEMORY_BYTES: ${PANDO_APPS_MEMORY_BYTES:-}
      PANDO_APPS_DISK_BYTES: ${PANDO_APPS_DISK_BYTES:-}
      # Pull private images with a Docker login for apps that have no registry
      # credential of their own (issue #41). Off by default: every app can then
      # pull whatever the login can read. The login is read from DOCKER_CONFIG,
      # so mount a config.json and point DOCKER_CONFIG at its directory.
      PANDO_APPS_DOCKER_CREDENTIALS: ${PANDO_APPS_DOCKER_CREDENTIALS:-}
      # Push metrics about Pando itself to an OpenTelemetry collector over
      # OTLP (R-399), such as http://otel-collector:4318. Unset exports
      # nothing. See docs/reference.md, Metrics.
      PANDO_METRICS_OTLP_ENDPOINT: ${PANDO_METRICS_OTLP_ENDPOINT:-}
      PANDO_METRICS_OTLP_PROTOCOL: ${PANDO_METRICS_OTLP_PROTOCOL:-http/protobuf}
      PANDO_METRICS_OTLP_HEADERS: ${PANDO_METRICS_OTLP_HEADERS:-}
      PANDO_METRICS_INTERVAL: ${PANDO_METRICS_INTERVAL:-1m}
      # Port-mode routing hands each app a host port and serves it at the root
      # of that port (design 03 §4.2). The range published below and the range
      # apps are allocated from have to be the same range, or apps past the end
      # of the published one get an address nothing can reach — so both are set
      # here, in one file, from one variable.
      #
      # Twenty rather than the shipped default of a thousand: Docker publishes a
      # range by opening every port in it, and a thousand is minutes of startup
      # and a process per port. Widen both together to host more than twenty
      # apps at once on a loopback install, or move to a routing adapter that
      # does subdomains, which needs no host ports at all (R-166).
      PANDO_SERVER_PORT_RANGE_START: ${PANDO_APP_PORT_START:-9000}
      PANDO_SERVER_PORT_RANGE_END: ${PANDO_APP_PORT_END:-9019}
    command: ["serve"]
    configs:
      - source: admin-password
        target: /run/pando-input/admin-password
    ports:
      - "${PANDO_PORT:-8080}:8080"
      - "${PANDO_APP_PORT_START:-9000}-${PANDO_APP_PORT_END:-9019}:${PANDO_APP_PORT_START:-9000}-${PANDO_APP_PORT_END:-9019}"
    volumes:
      # The runtime adapter needs this. Builds do NOT get it (R-112) — the builder
      # runs rootless and containerized with no socket, which is asserted by an
      # integration test in phase 4.
      #
      # Whoever holds this socket controls the daemon. On Linux, run rootless
      # Docker and point PANDO_DOCKER_SOCKET at its socket, usually
      # /run/user/1000/docker.sock (R-402): a compromise of Pando is then the
      # unprivileged user that daemon runs as, not root on the host. The
      # default is rootful Docker's socket, which is also Docker Desktop's.
      - ${PANDO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - pando-data:/var/lib/pando
      - pando-secrets:/run/pando-secrets:ro
      # Where the Traefik adapter writes its per-app configuration. Mounted
      # even when Traefik is not in use: an empty directory costs nothing, and
      # the alternative is a compose file that has to be edited before the
      # adapter can be turned on.
      #
      # There is no Traefik service in this file. Turning Traefik on is a
      # setting in Pando, and Pando starts it and mounts this same volume into
      # it (R-174, design 03 §4.4). It publishes ports 80 and 443 itself.
      - traefik-dynamic:/etc/traefik/dynamic
    restart: unless-stopped

  # Makes the database password, once, before anything else starts (issue
  # #130). There is no default password: an install whose database password is
  # in every copy of this file has one only in name.
  #
  # Thirty-two random bytes, written to a volume that Postgres and Pando mount
  # read-only, owned by the user Pando runs as (nonroot, 65532) and readable by
  # nobody else; Postgres reads it as root before dropping privileges. A later
  # start finds the file and leaves it, because the database was made with it.
  # To choose the password yourself, set POSTGRES_PASSWORD before the first
  # start; it is written to the file instead.
  #
  # A chosen password reaches this service as a file (the postgres-password
  # config below), not an environment variable: a container's environment is
  # in `docker inspect` for as long as the container exists, and this one stays
  # after it exits. The script removes its copy once read, so the stopped
  # container holds none either. Unset, the file is empty and one is generated.
  #
  # The Postgres image, so there is nothing more to pull, with its own
  # entrypoint set aside: it runs this script and exits.
  secrets:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        f=/run/pando-secrets/postgres-password
        in=/run/pando-input/postgres-password
        chosen=
        # Unset, Compose mounts a directory here rather than an empty file.
        if [ -f "$$in" ]; then chosen=$$(cat "$$in"); fi
        rm -rf "$$in" 2>/dev/null || true
        if [ ! -s "$$f" ]; then
          umask 077
          if [ -n "$$chosen" ]; then
            printf '%s' "$$chosen" > "$$f.new"
          else
            head -c 32 /dev/urandom | base64 | tr -d '\n=+/' > "$$f.new"
          fi
          mv "$$f.new" "$$f"
          echo "made the database password"
        elif [ -n "$$chosen" ] && [ "$$(cat "$$f")" != "$$chosen" ]; then
          echo "POSTGRES_PASSWORD is ignored: the database was made with the password already in $$f" >&2
        fi
        chown 65532:65532 "$$f"
        chmod 0400 "$$f"
    configs:
      - source: postgres-password
        target: /run/pando-input/postgres-password
    volumes:
      - pando-secrets:/run/pando-secrets
    restart: "no"

  postgres:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: pando
      POSTGRES_PASSWORD_FILE: /run/pando-secrets/postgres-password
      POSTGRES_DB: pando
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pando-secrets:/run/pando-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pando -d pando"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

configs:
  # The password an operator chose, if any, for the secrets service above.
  # `docker compose config` shows it, as it shows everything from .env, which
  # is where it came from.
  postgres-password:
    content: ${POSTGRES_PASSWORD:-}
  # The first administrator's password, if the operator chose one, read by
  # Pando through PANDO_ADMIN_PASSWORD_FILE. Shown by `docker compose config`
  # for the same reason as the one above.
  admin-password:
    content: ${PANDO_ADMIN_PASSWORD:-}

volumes:
  pando-data:
  postgres-data:

  # The database password, made by the secrets service. It and postgres-data
  # belong together: a backup or move of one without the other leaves a
  # database nobody has the password to.
  pando-secrets:

  # Shared between Pando and Traefik: Pando writes, Traefik reads. Read-only on
  # the Traefik side, because the edge has no business editing the routes it is
  # given.
  traefik-dynamic:
