<!doctype html>
<!-- Source for social-preview.png, the repository's 1280×640 social preview.
     Regenerate by screenshotting this file at 1280×640, scale factor 1, in
     headless Chrome:
       chrome --headless --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1280,640 --allow-file-access-from-files \
         --screenshot=social-preview.png file://$PWD/social-preview.html
     Upload the PNG under Settings → General → Social preview. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pando social preview</title>
<link rel="stylesheet" href="../../.claude/skills/pando-design/styles.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1280px;
    height: 640px;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  .sheet {
    position: absolute;
    inset: var(--space-6);
    border: var(--border-width) solid var(--rule-strong);
  }
  .tick { position: absolute; width: var(--space-2); height: var(--space-2); border-color: var(--ink-secondary); border-style: solid; border-width: 0; }
  .tick.tl { top: -1px; left: -1px; border-top-width: 1px; border-left-width: 1px; }
  .tick.tr { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
  .tick.bl { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
  .tick.br { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }
  .marginalia {
    position: absolute;
    top: var(--space-3);
    left: var(--space-4);
    right: var(--space-4);
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: var(--size-16);
    color: var(--ink-secondary);
  }
  .copy {
    position: absolute;
    left: var(--space-9);
    top: 50%;
    transform: translateY(-50%);
    width: 560px;
  }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 144px;
    line-height: 1;
    letter-spacing: var(--tracking-wordmark);
    margin: 0 0 var(--space-4);
  }
  .wordmark span { color: var(--marker); }
  .tagline {
    font: var(--type-h1);
    letter-spacing: var(--tracking-headline);
    margin: 0 0 var(--space-4);
  }
  .lede {
    font-family: var(--font-ui);
    font-size: var(--size-24);
    line-height: 1.4;
    color: var(--ink-secondary);
    margin: 0;
  }
  .terrain {
    position: absolute;
    right: var(--space-8);
    top: 50%;
    transform: translateY(-50%);
  }
  .scale {
    position: absolute;
    left: var(--space-4);
    bottom: var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-family: var(--font-ui);
    font-size: var(--size-16);
    color: var(--ink-secondary);
  }
  .scale .bar { display: flex; }
  .scale .bar i { width: var(--space-5); height: var(--space-2); border: 1px solid var(--ink); border-left: 0; background: var(--paper-raised); }
  .scale .bar i:first-child { border-left: 1px solid var(--ink); }
  .scale .bar i:nth-child(odd) { background: var(--ink); }
</style>
</head>
<body>
  <div class="sheet">
    <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
    <div class="marginalia"><span>38°31′30″N</span><span>111°45′00″W</span></div>
    <div class="scale"><span class="bar"><i></i><i></i><i></i><i></i></span><span>0&nbsp;&nbsp;&nbsp;½&nbsp;&nbsp;&nbsp;1 mi</span></div>
  </div>

  <div class="copy">
    <h1 class="wordmark">pando<span>.</span></h1>
    <p class="tagline">Deploy and share apps</p>
    <p class="lede">Open source and self-hosted. Builds, scans and runs your team’s apps behind your company’s SSO.</p>
  </div>

  <svg class="terrain" id="terrain" width="560" height="440" viewBox="0 0 560 440" aria-hidden="true"></svg>

<script>
  // The same terrain ContourMap draws: one shape function scaled per ring, so
  // rings are irregular, roughly concentric and never cross.
  const shape = t => 1 + 0.10 * Math.sin(3 * t + 0.7) + 0.07 * Math.sin(5 * t + 2.1)
    + 0.045 * Math.sin(7 * t + 4.4) + 0.03 * Math.sin(2 * t + 1.3);
  function ringPath(cx, cy, r, kx, ky, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2, rr = r * shape(t);
      pts.push([cx + Math.cos(t) * rr * kx, cy + Math.sin(t) * rr * ky]);
    }
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let d = 'M ' + mid(pts[n - 1], pts[0]).join(' ');
    for (let i = 0; i < n; i++) {
      const m = mid(pts[i], pts[(i + 1) % n]);
      d += ` Q ${pts[i][0]} ${pts[i][1]} ${m[0]} ${m[1]}`;
    }
    return d + ' Z';
  }
  const svg = document.getElementById('terrain');
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 280, cy = 214, count = 9, spacing = 22, inner = spacing * 0.9;
  for (let i = count - 1; i >= 0; i--) {
    const r = inner + i * spacing * (1 + 0.06 * Math.sin(i * 1.7));
    const index = i % 5 === 0;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', ringPath(cx, cy, r, 1.22, 0.86, 96));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', index ? 'var(--contour)' : 'var(--contour-line)');
    p.setAttribute('stroke-width', index ? '2' : '1.5');
    svg.appendChild(p);
  }
  // Summit: the survey benchmark triangle, the one marker-red mark.
  const s = 14;
  const tri = document.createElementNS(NS, 'polygon');
  tri.setAttribute('points', `${cx},${cy - s * 0.62} ${cx + s * 0.62},${cy + s * 0.5} ${cx - s * 0.62},${cy + s * 0.5}`);
  tri.setAttribute('fill', 'var(--marker)');
  svg.appendChild(tri);
  // Elevation label set on the fifth (index) ring, the line broken around it.
  const r5 = inner + 5 * spacing * (1 + 0.06 * Math.sin(5 * 1.7));
  const lx = cx + r5 * shape(0) * 1.22;
  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('x', lx - 42); bg.setAttribute('y', cy - 11);
  bg.setAttribute('width', 84); bg.setAttribute('height', 22);
  bg.setAttribute('fill', 'var(--paper)');
  svg.appendChild(bg);
  const label = document.createElementNS(NS, 'text');
  label.setAttribute('x', lx); label.setAttribute('y', cy + 5);
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('style', 'font-family: var(--font-mono); font-size: var(--size-14); fill: var(--contour-text)');
  label.textContent = '9,140 ft';
  svg.appendChild(label);
</script>
</body>
</html>
