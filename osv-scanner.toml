# Advisories osv-scanner reports that this repository accepts. OpenSSF
# Scorecard's Vulnerabilities check runs osv-scanner and reads this file from the
# repository root, so an entry here is what clears a Scorecard alert.
#
# The same rules as .github/govulncheck-allowlist.txt apply: every entry says why
# it does not apply, and an entry is removed the moment a fixed version exists.
# Keep the two files in step — the full analysis lives in the allowlist.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = """
golang.org/x/crypto/openpgp is unmaintained. The advisory names the whole
golang.org/x/crypto module and has no fixed version. Pando requires the module
for argon2 only; the openpgp package is not linked (`go list -deps ./...` does
not name it, and govulncheck reports it as not called). Pando's OpenPGP comes
from github.com/ProtonMail/go-crypto/openpgp via go-git, the maintained fork
the advisory recommends. Revisit if `go list -deps ./...` ever names
golang.org/x/crypto/openpgp.
"""
